<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>smAisle Daily</title>
<meta name="robots" content="noindex">
<meta name="description" content="Today's daily games from smAisle: The Daily 15, A, B, C, Deal and Gramble.">
<meta name="theme-color" content="#f4efe1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="smAisle Daily">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Libre+Franklin:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe1;--paper2:#ebe4d0;--ink:#1a1814;--ink2:#4a453b;--fade:#8c8574;--card:#fffdf6;--hi:#ffd43b;--ok:#2e7d32}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;background:var(--paper);background-image:radial-gradient(#e3dcc7 1px,transparent 1px);background-size:6px 6px;color:var(--ink);font-family:'Libre Franklin',sans-serif;min-height:100%;-webkit-text-size-adjust:100%}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-decoration:none}
.wrap{max-width:440px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px 130px}
.home{display:inline-block;font:800 12px 'Libre Franklin';color:var(--ink2);padding:2px 0 8px}
.bar{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:baseline;gap:7px}
.logo .sm{font:800 13px 'Libre Franklin';background:var(--hi);border:1.5px solid var(--ink);padding:1px 6px}
.logo .d{font:900 30px 'Playfair Display'}
.date{font:700 11px 'Libre Franklin';letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
.widget{margin-top:12px;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:3px 3px 0 rgba(0,0,0,.12)}
.widget .t{font:800 11px 'Libre Franklin';letter-spacing:.1em;color:var(--ink2)}
.widget .big{font:900 22px 'Playfair Display';margin:3px 0 8px}
.prog{display:flex;gap:6px}.prog span{flex:1;height:8px;border-radius:4px;background:var(--paper2);border:1px solid var(--ink);transition:background .3s}.prog span.on{background:var(--hi)}
.widget .row{display:flex;justify-content:space-between;font:600 12px 'Libre Franklin';margin-top:7px;color:var(--ink2)}
.sec{font:800 11px 'Libre Franklin';letter-spacing:.12em;color:var(--ink2);margin:16px 2px 8px;display:flex;align-items:center;gap:8px}.sec:after{content:"";flex:1;border-top:1.5px solid var(--ink2)}
.r{width:100%;text-align:left;display:flex;align-items:center;gap:11px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;margin-bottom:9px;box-shadow:2px 2px 0 rgba(0,0,0,.1)}
.r:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(0,0,0,.1)}
.r img,.r .phi{width:48px;height:48px;border-radius:11px;border:1px solid rgba(0,0,0,.2);flex:none}
.r .tx{flex:1;min-width:0}.r .n{font:900 17px/1.1 'Playfair Display'}.r .s{font:500 12px 'Libre Franklin';color:var(--ink2);margin-top:2px}
.r .b{font:800 11px 'Libre Franklin';letter-spacing:.06em;background:var(--ink);color:var(--card);padding:8px 11px;border-radius:6px;white-space:nowrap}
.r .b.done{background:none;color:var(--ok);border:2px solid var(--ok);padding:6px 9px}
.r .b.go{background:var(--hi);color:var(--ink);border:2px solid var(--ink);padding:6px 9px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;justify-items:center;margin-top:4px}
.app{width:78px;display:flex;flex-direction:column;align-items:center;gap:6px}
.app:active .ico{transform:scale(.94)}
.ico{width:62px;height:62px;border-radius:15px;box-shadow:0 2px 6px rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.15);background:var(--card);display:flex;align-items:center;justify-content:center;font:900 30px 'Playfair Display';transition:transform .1s;position:relative}
.ico .in{width:100%;height:100%;border-radius:15px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ico img{width:100%;height:100%;display:block}
.nm{font:600 11px/1.15 'Libre Franklin';text-align:center}
.soon .ico{border:2px dashed var(--fade);background:transparent;box-shadow:none}.soon .nm{color:var(--fade)}
.phi{display:flex;align-items:center;justify-content:center;font:900 26px 'Playfair Display'}
.dock{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 24px));height:88px;border-radius:28px;background:rgba(244,239,225,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid rgba(26,24,20,.18);display:flex;justify-content:space-around;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:5}
.dock .app{width:70px}.dock .nm{font-size:10.5px}
.dk{width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center}
.dk svg{width:26px;height:26px}
.dk.y{background:var(--hi);color:var(--ink);border:2px solid var(--ink)}
.ver{text-align:center;font:600 11px 'Libre Franklin';color:var(--fade);margin-top:18px}
/* sheet */
.scrim{position:fixed;inset:0;z-index:11;background:rgba(26,24,20,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(460px,100%);max-height:86vh;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom));transition:transform .25s ease;z-index:12}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--fade);margin:0 auto 12px;opacity:.6}
.sh-head{display:flex;gap:14px;align-items:center}
.sh-head .pic{width:72px;height:72px;border-radius:17px;overflow:hidden;border:1px solid rgba(0,0,0,.2);flex:none}
.sh-head .pic img,.sh-head .pic .phi{width:100%;height:100%;border:0;border-radius:0}
.sh-head h2{font:900 26px/1.05 'Playfair Display'}
.sh-head .tag{font:700 11px 'Libre Franklin';letter-spacing:.08em;color:var(--ink2);margin-top:4px;text-transform:uppercase}
.sheet h2.t{font:900 26px 'Playfair Display'}
.sheet p{font:500 14.5px/1.5 'Libre Franklin';color:var(--ink2);margin-top:12px}
.sheet h3{font:800 12px 'Libre Franklin';letter-spacing:.1em;margin-top:18px;color:var(--ink2)}
.big-btn{display:block;width:100%;text-align:center;font:800 15px 'Libre Franklin';letter-spacing:.06em;background:var(--ink);color:var(--card);padding:15px;border-radius:8px;margin-top:16px}
.big-btn.o{background:none;color:var(--ink);border:2px solid var(--ink);margin-top:10px}
.big-btn.off{background:none;color:var(--fade);border:2px dashed var(--fade);cursor:default}
.small{font:500 12px/1.4 'Libre Franklin';color:var(--fade);margin-top:10px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);margin-top:14px}
.stats div{text-align:center;padding:10px 0}.stats div+div{border-left:1px solid var(--fade)}
.stats b{display:block;font:900 26px 'Playfair Display'}.stats span{font:700 10.5px 'Libre Franklin';letter-spacing:.06em;color:var(--ink2)}
.list{margin-top:10px}.list .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--paper2);font:600 14px 'Libre Franklin'}
.list .li em{font-style:normal;color:var(--fade);font-weight:500;font-size:13px;text-align:right}
.dots{display:flex;gap:5px}.dots i{width:22px;height:22px;border-radius:6px;overflow:hidden;opacity:.22;filter:grayscale(1)}.dots i.on{opacity:1;filter:none}.dots img{width:100%;height:100%;display:block}
.plus li{list-style:none;padding:8px 0;font:600 14.5px 'Libre Franklin';border-bottom:1px solid var(--paper2)}
.plus li:before{content:"★ ";color:#c99a00}
.as{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:#0a84ff;color:#fff;font:800 8.5px 'Libre Franklin';letter-spacing:.04em;padding:2px 5px;border-radius:6px;white-space:nowrap;border:1.5px solid var(--paper)}
.store-btn{background:#0a84ff;color:#fff}
.moreWrap{margin-top:44px;padding-top:18px;border-top:4px double var(--ink)}
.moreBtn{width:100%;display:flex;align-items:center;gap:12px;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;text-align:left}
.moreBtn .mini{display:flex;flex:none}.moreBtn .mini img{width:34px;height:34px;border-radius:9px;border:2px solid var(--paper);margin-left:-10px}.moreBtn .mini img:first-child{margin-left:0}
.moreBtn .n{font:800 15px 'Libre Franklin'}.moreBtn .s{font:500 12px 'Libre Franklin';color:var(--ink2);margin-top:2px}.moreBtn .tx{flex:1}.moreBtn .arr{font-size:28px;opacity:.7}
.shelf{position:fixed;inset:0;z-index:9;background:radial-gradient(circle at 20% 0%,#2a2f55 0,#14161f 55%);color:#fff;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 18px 40px;transform:translateY(100%);transition:transform .3s ease;visibility:hidden}
.shelf.on{transform:none;visibility:visible}
.shelf>*{max-width:440px;margin-left:auto;margin-right:auto}
.back{color:#8fb8ff;font:700 15px 'Libre Franklin';padding:6px 0}
.shelf-h{font:900 34px 'Libre Franklin';letter-spacing:-.02em;margin-top:10px}.shelf-h span{display:block;font:600 14px 'Libre Franklin';opacity:.6;letter-spacing:0}
.sec2{font:800 11px 'Libre Franklin';letter-spacing:.12em;opacity:.6;margin:22px 2px 12px}
.shelf .grid{margin-top:0}.shelf .nm{color:#fff}.shelf .soon .nm{color:#8b90a8}.shelf .soon .ico{border-color:#4a4f6a}
.shelf .ico{border-color:rgba(255,255,255,.15);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.shelf .as{border-color:#14161f}
.shelf .ver{color:#8b90a8;margin-top:34px}
</style></head><body>
<div class="wrap">
 <a class="home" href="https://smaisle.app/">‹ smAisle Home</a>
 <div class="bar"><div class="logo"><span class="sm">smAisle</span><span class="d">Daily</span></div><span class="date" id="date"></span></div>
 <div class="widget"><div class="t">TODAY</div><div class="big" id="streak"></div>
  <div class="prog" id="prog"></div>
  <div class="row"><span id="played"></span><span id="next"></span></div></div>
 <div class="sec">TODAY'S GAMES</div>
 <div id="daily"></div>
 <div class="moreWrap"><button class="moreBtn" id="openShelf"><div class="mini" id="mini"></div><div class="tx"><div class="n">More games by smAisle</div><div class="s">Arcade, puzzle and strategy games</div></div><span class="arr">›</span></button></div>
 <div class="ver" id="ver"></div>
</div>
<nav class="dock">
 <button class="app" data-sheet="archive"><div class="dk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></svg></div><div class="nm">Archive</div></button>
 <button class="app" data-sheet="stats"><div class="dk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 20V12M12 20V5M18 20v-6"/></svg></div><div class="nm">Stats</div></button>
 <button class="app" data-sheet="plus"><div class="dk y"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z"/></svg></div><div class="nm">Plus</div></button>
 <button class="app" data-sheet="help"><div class="dk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .9-1 1.6V14"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></svg></div><div class="nm">How to Play</div></button>
</nav>
<div class="shelf" id="shelf"><div><button id="closeShelf" class="back">‹ smAisle Daily</button></div>
 <div class="shelf-h">More games<span>by smAisle</span></div>
 <div class="grid" id="more" style="margin-top:26px"></div>
 <div class="ver" id="ver2"></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<script src="games.js"></script>
<script>
const VERSION='1.06',VDATE='Nov 1',VER=`smAisle Daily v${VERSION} · ${VDATE}`;
const $=id=>document.getElementById(id);
const SM=window.SMAISLE,GAMES=SM.games,DAILY=GAMES.filter(g=>g.daily),N=DAILY.length;
// On smaisle.app (or smaisle.github.io) games open in this tab (and share its storage). Anywhere else (the Claude link) they open in a new tab.
const SITE=/github\.io$|smaisle\.app$/.test(location.hostname);
const TGT=SITE?'':' target="_blank" rel="noopener"';
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  json(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayAt=off=>{const d=new Date();d.setDate(d.getDate()-off);return SM.dayKey(d)};
const fmtDay=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};

/* ---------- History: which daily games were finished each day ---------- */
// The games keep their own results; the hub also remembers what it has seen in smd_hist so stats survive the games trimming theirs.
function doneOn(day){const h=store.json('smd_hist',{}),seen=h[day]||[];return DAILY.filter(g=>seen.indexOf(g.id)>=0||SM.isDone(g.id,day)).map(g=>g.id)}
function remember(){const h=store.json('smd_hist',{});for(let i=0;i<60;i++){const d=dayAt(i),l=doneOn(d);if(l.length)h[d]=l}
  const k=Object.keys(h).sort();while(k.length>400)delete h[k.shift()];store.put('smd_hist',h);return h}
function streaks(h){
  let cur=0;for(let i=h[dayAt(0)]?0:1;;i++){if(h[dayAt(i)])cur++;else break}
  const days=Object.keys(h).sort();let best=0,run=0,prev=null;
  for(const d of days){const [y,m,dd]=d.split('-').map(Number);const t=new Date(y,m-1,dd).getTime();run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;best=Math.max(best,run)}
  return {cur,best:Math.max(best,cur),total:days.length};
}

/* ---------- Main screen ---------- */
function pic(g,cls){return g.icon?`<img src="${g.icon}" alt=""${cls?` class="${cls}"`:''}>`:`<div class="phi ${cls||''}" style="background:${g.ph[0]};color:${g.ph[1]}">${g.ph[2]}</div>`}
function tile(g){return `<button class="app" data-g="${g.id}"><div class="ico" style="${g.icon?'':`background:${g.ph[0]};color:${g.ph[1]}`}"><div class="in">${g.icon?`<img src="${g.icon}" alt="">`:g.ph[2]}</div></div><div class="nm">${esc(g.name).replace(' ','<br>')}</div></button>`}
let H={};
function render(){
  H=remember();const today=dayAt(0),done=H[today]||[],n=done.length,st=streaks(H);
  $('date').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  $('streak').textContent=st.cur?`🔥 ${st.cur}-day streak`:'Start a streak today';
  $('prog').innerHTML=DAILY.map((g,i)=>`<span class="${i<n?'on':''}"></span>`).join('');
  $('played').textContent=n===N?`All ${N} daily games done!`:n===0?(st.cur?'Play today to keep it':'Finish a daily game to start'):`${n} of ${N} daily games done`;
  $('daily').innerHTML=DAILY.map(g=>{const d=done.indexOf(g.id)>=0,s=!d&&SM.isStarted(g.id,today);
    return `<button class="r" data-g="${g.id}">${pic(g)}<div class="tx"><div class="n">${esc(g.name)}</div><div class="s">${esc(g.sub)}</div></div><span class="b ${d?'done':s?'go':''}">${d?'✓ DONE':s?'KEEP GOING':'PLAY'}</span></button>`}).join('');
  $('mini').innerHTML=['sd','sb','br'].map(id=>`<img src="${SM.game(id).icon}" alt="">`).join('');
  $('more').innerHTML=GAMES.filter(g=>!g.daily).map(tile).join('')+`<div class="app soon"><div class="ico"></div><div class="nm">Coming<br>soon</div></div>`;
  $('ver').textContent=$('ver2').textContent=VER;
}
function tick(){const now=new Date(),mid=new Date(now);mid.setHours(24,0,0,0);const m=Math.max(0,Math.ceil((mid-now)/60000));$('next').textContent=`New games in ${Math.floor(m/60)}h ${m%60}m`;
  if(dayAt(0)!==lastDay){lastDay=dayAt(0);render()}}
let lastDay=dayAt(0);

/* ---------- Sheets ---------- */
const sheet=$('sheet'),scrim=$('scrim'),body=$('sheetBody');
function open(html){body.innerHTML=html;sheet.scrollTop=0;sheet.classList.add('on');scrim.classList.add('on')}
function close(){sheet.classList.remove('on');scrim.classList.remove('on')}
scrim.onclick=close;
function openGame(id){const g=SM.game(id),d=g.daily&&(H[dayAt(0)]||[]).indexOf(id)>=0;
  let btns;
  if(g.store)btns=(g.appStore?`<a class="big-btn store-btn" href="${g.appStore}" data-tap="${g.id}-app"${TGT}>GET THE FREE APP</a>`:`<div class="big-btn off">APP STORE: COMING SOON</div>`)+`<a class="big-btn o" href="${g.url}" data-tap="${g.id}"${TGT}>PLAY ON THE WEB</a>`;
  else btns=`<a class="big-btn" href="${g.url}" data-tap="${g.id}"${TGT}>${g.daily?(d?'PLAY AGAIN':"PLAY TODAY'S GAME"):'PLAY ON THE WEB'}</a>`;
  open(`<div class="sh-head"><div class="pic">${pic(g)}</div><div><h2>${esc(g.name)}</h2><div class="tag">${esc(g.tag)}${g.daily?'':g.store?' · App Store':' · Play on the web'}</div></div></div>
  <p>${esc(g.desc)}</p>${btns}
  ${g.daily&&d?'<div class="small">✓ You finished today\'s game.</div>':''}
  ${g.daily&&!SITE?'<div class="small">Games open in a new tab here. On smaisle.app/daily your Done checks and streak fill in by themselves.</div>':''}`);
}
const SHEETS={
  archive:()=>{let rows='';for(let i=1;i<=14;i++){const d=dayAt(i),l=H[d]||[];
      rows+=`<div class="li">${fmtDay(d)}<span class="dots">${DAILY.map(g=>`<i class="${l.indexOf(g.id)>=0?'on':''}" title="${esc(g.name)}"><img src="${g.icon}" alt=""></i>`).join('')}</span></div>`}
    return `<h2 class="t">Archive</h2><p>Which daily games you finished on each day. To play an earlier day, open the game and tap Archive in its menu.${DAILY.some(g=>!g.archive)?' '+DAILY.filter(g=>!g.archive).map(g=>esc(g.name)).join(' and ')+' has no Archive yet.':''}</p>
    <div class="list">${rows}</div><h3>OPEN A GAME'S ARCHIVE</h3>${DAILY.filter(g=>g.archive).map(g=>`<a class="big-btn o" href="${g.url}" data-tap="${g.id}-arch"${TGT}>${esc(g.name)}</a>`).join('')}`},
  stats:()=>{const st=streaks(H),days=Object.keys(H),per=id=>days.filter(d=>H[d].indexOf(id)>=0).length,all=days.filter(d=>H[d].length>=N).length;
    return `<h2 class="t">Stats</h2><p>One streak across all your daily games. A day counts when you finish at least one of them.</p>
    <div class="stats"><div><b>${st.cur}</b><span>STREAK</span></div><div><b>${st.best}</b><span>BEST STREAK</span></div><div><b>${st.total}</b><span>DAYS PLAYED</span></div></div>
    <h3>BY GAME</h3><div class="list">${DAILY.map(g=>`<div class="li">${esc(g.name)}<em>${per(g.id)} ${per(g.id)===1?'day':'days'} finished</em></div>`).join('')}<div class="li">All ${N} in one day<em>${all} ${all===1?'day':'days'}</em></div></div>
    <div class="small">Each game has its own detailed stats in its menu. Counted on this device only.</div>`},
  plus:()=>`<h2 class="t">smAisle Plus</h2><p>Coming soon: one purchase that unlocks extras in every smAisle game.</p><ul class="plus" style="margin-top:10px"><li>Full Archive for every daily game</li><li>Fresh random games after today's</li><li>Every new game as it's added</li></ul><div class="big-btn off">COMING SOON</div><div class="small">Nothing to buy yet. Every game is free to play.</div>`,
  help:()=>`<h2 class="t">How to Play</h2><p><b>Today's Games</b> are the daily ones. Each has a new game every day at midnight, the same for everyone. Tap one to play it.</p><p><b>Done checks</b> fill in by themselves when you finish a game on this device.</p><p><b>Your streak</b> grows each day you finish at least one daily game. The bar on the Today card fills as you finish all ${N}.</p><p><b>More games by smAisle</b>, below Today's Games, are always-on games you can play any time.</p><p><b>Archive and Stats</b> in the dock cover every daily game.</p><div class="small" style="margin-top:18px">${VER}</div>`
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-tap]');if(a){tap(a.dataset.tap);return}
  const g=e.target.closest('[data-g]');if(g)return openGame(g.dataset.g);
  if(e.target.closest('#openShelf'))return $('shelf').classList.add('on');
  if(e.target.closest('#closeShelf'))return $('shelf').classList.remove('on');
  const s=e.target.closest('[data-sheet]');if(s)open(SHEETS[s.dataset.sheet]());
});
// Coming back to this tab from a game: refresh the Done checks.
