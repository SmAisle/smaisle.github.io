<script>
const VERSION='1.24',VDATE='Nov 2',VER=`smAisle Daily v${VERSION} · ${VDATE}`;
const $=id=>document.getElementById(id);
const SM=window.SMAISLE,GAMES=SM.games,DAILY=GAMES.filter(g=>g.daily&&!g.plus),PLUSG=GAMES.filter(g=>g.plus),N=DAILY.length;
// On smaisle.app (or smaisle.github.io) games open in this tab (and share its storage). Anywhere else (the Claude link) they open in a new tab.
const SITE=/github\.io$|smaisle\.app$/.test(location.hostname);
const TGT=SITE?'':' target="_blank" rel="noopener"';
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  json(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayAt=off=>{const d=new Date();d.setDate(d.getDate()-off);return SM.dayKey(d)};
const fmtDay=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};

/* ---------- History: which daily games were finished each day ---------- */
// The games keep their own results; the hub also remembers what it has seen in smd_hist so stats survive the games trimming theirs.
function doneOn(day){const h=store.json('smd_hist',{}),seen=h[day]||[];return DAILY.filter(g=>seen.indexOf(g.id)>=0||SM.isDone(g.id,day)).map(g=>g.id)}
function remember(){const h=store.json('smd_hist',{});for(let i=0;i<60;i++){const d=dayAt(i),l=doneOn(d);if(l.length)h[d]=l}
  const k=Object.keys(h).sort();while(k.length>400)delete h[k.shift()];store.put('smd_hist',h);return h}
/* ---------- Plus perks ---------- */
// Plus member: the app tells the hub (DG_APP.plus). On the website Plus is unlocked for everyone for now, so its perks apply there too.
const member=()=>!window.SMD_APP||!!(window.DG_APP&&DG_APP.plus);
// Founding Member: the app sets DG_APP.founding when the subscription's original purchase was before Feb 1, 2027 (ET).
// Website visitors aren't members, so no badge there.
const founder=()=>!!(window.SMD_APP&&window.DG_APP&&DG_APP.plus&&DG_APP.founding);
function streaks(h){
  // Streak protection (Plus): one missed day is forgiven, at most once every 7 days. Forgiven days keep the streak alive but don't add to it.
  // Today never breaks the streak: it's still in progress.
  const protect=member(),days=Object.keys(h).sort(),saved=[];
  const key=t=>SM.dayKey(new Date(t)),D=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getTime()};
  let cur=0,best=0,last=null;
  if(days.length){const today=dayAt(0);
    for(let t=D(days[0]);key(t)<=today;t=new Date(new Date(t).setDate(new Date(t).getDate()+1)).getTime()){const k=key(t);
      if(h[k]){cur++}
      else if(k===today){}
      else if(protect&&cur>0&&(last==null||Math.round((t-last)/864e5)>=7)){last=t;saved.push(k)}
      else{cur=0;saved.length=0}
      best=Math.max(best,cur)}}
  return {cur,best,total:days.length,saved};  // saved: forgiven days in the current streak
}
