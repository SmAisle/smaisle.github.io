<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>smAisle Daily Owner</title>
<style>
  :root{--bg:#070b1a;--paper:#121a38;--ink:#f5f7ff;--muted:#93a0c4;--line:#26315a;--hot:#ffd43b}
  *{box-sizing:border-box} html,body{touch-action:manipulation} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:2}
  h1{font-size:1.25rem;margin:0} h1 em{font-style:normal;color:var(--hot)} main{max-width:900px;margin:0 auto;padding:16px}
  button{font:600 .9rem inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
  button.primary{background:var(--hot);border-color:var(--hot);color:#111}
  .muted{color:var(--muted)} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:.85rem}
  table{border-collapse:collapse;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem;font-variant-numeric:tabular-nums} th{color:var(--muted);font-weight:600}
  h2{font-size:1.05rem;margin:18px 0 8px}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
</style>
</head>
<body>
<header>
  <h1>smAisle <em>Daily</em> owner</h1>
  <div class="row"><span id="who" class="muted"></span><button id="signin" class="primary" hidden>Sign in with Google</button><button id="signout" hidden>Sign out</button></div>
</header>
<main>
  <p id="msg" class="muted">Loading…</p>
  <section id="usage" hidden></section>
  <p class="muted" style="font-size:.8rem">Owner page v1.0 · Nov 1</p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {"apiKey":"AIzaSyAlbSCTpAiK-1tojkyWrY3QuJsSzILHSfs","authDomain":"aislerun-88e79.firebaseapp.com","projectId":"aislerun-88e79","storageBucket":"aislerun-88e79.firebasestorage.app","messagingSenderId":"589354345822","appId":"1:589354345822:web:c254c32c792212af381bcf"};
const $=s=>document.querySelector(s), esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DEV=[];
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(), db=firebase.firestore();
$("#signin").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{$("#msg").textContent="Sign-in didn't work: "+e.message;});
$("#signout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
  $("#signin").hidden=!!u; $("#signout").hidden=!u; $("#who").textContent=u?u.email:""; $("#usage").hidden=true;
  if(!u){ $("#msg").textContent="Sign in with the smAisle owner's Google account to see how many people open smAisle Daily."; return; }
  $("#msg").textContent="Loading…";
  try{
    const ds=await db.collection("smd_devices").limit(10000).get();
    DEV=ds.docs.map(d=>({id:d.id,...d.data()}));
    $("#msg").textContent=""; draw(); $("#usage").hidden=false;
  }catch(e){ $("#msg").textContent = e.code==="permission-denied" ? "This account can't view usage. Only the owner can." : "Couldn't load usage: "+e.message; }
});
// Days are the player's own date, like the games. Today here is your date in New York.
const pad=n=>String(n).padStart(2,"0"), dayStr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ago=n=>{const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));d.setDate(d.getDate()-n);return dayStr(d);}, num=n=>Number(n||0).toLocaleString();
const NAMES={d15:"The Daily 15",abc:"A, B, C, Deal",gr:"Gramble",sd:"Straight Down",sb:"Shuffle Blast",br:"Bullseye Roulette",cn:"Connello",sh:"Steal Home"};
const tapName=k=>{const [g,w]=k.split("-"); return (NAMES[g]||g)+(w==="app"?", App Store":w==="arch"?", from Archive":"");};
function draw(){
  const today=ago(0), w=ago(6), m=ago(29), cnt=f=>DEV.filter(f).length;
  const stat=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  const opened=d=>cnt(x=>x.o&&x.o[d]!=null), played=d=>cnt(x=>x.p&&+x.p[d]>0), all3=d=>cnt(x=>x.p&&+x.p[d]>=3), opens=d=>DEV.reduce((a,x)=>a+(x.o&&+x.o[d]||0),0);
  const days=[]; for(let i=0;i<14;i++){ const d=ago(i); days.push([d,opened(d),played(d),all3(d),opens(d),cnt(x=>x.first===d)]); }
  const taps={}; DEV.forEach(d=>Object.entries(d.x||{}).forEach(([k,v])=>{taps[k]=(taps[k]||0)+(+v||0);}));
  const tallyBy=k=>{const t={}; DEV.filter(d=>d.last>=m).forEach(d=>{const v=k==="desk"?(d.desk?"Computer":"Phone"):String(d[k]??"?"); t[v]=(t[v]||0)+1;}); return Object.entries(t).sort((a,b)=>b[1]-a[1]);};
  const tbl=(title,rows)=>`<div><h2>${title}</h2><table>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${num(v)}</td></tr>`).join("")||`<tr><td class="muted">None yet</td><td></td></tr>`}</table></div>`;
  $("#usage").innerHTML=`<div class="stats">${stat(opened(today),"opened today")}${stat(played(today),"played a daily game today")}${stat(all3(today),"did all 3 today")}${stat(cnt(d=>d.last>=w),"active this week")}${stat(cnt(d=>d.last>=m),"active this month")}${stat(DEV.length,"devices ever")}${stat(cnt(d=>d.first>=w),"new this week")}${stat(cnt(d=>d.last>=w&&+d.streak>=3),"on a 3+ day streak")}</div>
  <p class="muted">Counts phones and computers, not people. A device checks in when it opens smAisle Daily on smaisle.github.io/daily and when it taps a game. "Played" means it had finished at least one daily game that day when it last checked in. The Claude-link copy isn't counted.</p>
  <h2>Last 14 days</h2><div style="overflow-x:auto"><table><tr><th>Day</th><th>Opened</th><th>Played 1+</th><th>All 3</th><th>Opens</th><th>New</th></tr>${days.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div>
  <div class="two">
  ${tbl("Taps on games (all time)",Object.entries(taps).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[tapName(k),v]))}
  ${tbl("Version, active this month",tallyBy("v").map(([k,v])=>["Version "+k,v]))}
  ${tbl("Device, active this month",tallyBy("desk"))}
  </div>`;
}
</script>
</body>
</html>
